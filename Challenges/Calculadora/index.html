<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/main.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <title>Calculadora</title>
  </head>
  <body>
    <div class="grid-container">
              
        <div class="results">
            <div class="history"></div>
            <div class="output"></div>
        </div>
            
        <div class="btn btn-clear">C</div>
        <div class="btn btn-operator">%</div>
        <div class="btn btn-operator">/</div>
        <div class="btn btn-operator" data-valor="*">x</div>

        <div class="btn">7</div>
        <div class="btn">8</div>
        <div class="btn">9</div>
        <div class="btn btn-operator">-</div>

        <div class="btn">4</div>
        <div class="btn">5</div>
        <div class="btn">6</div>
        <div class="btn btn-equal itemEqual">=</div>  

        <div class="btn btn-operator">+</div>
        <div class="btn">1</div>
        <div class="btn">2</div>
        <div class="btn">3</div>

        <div class="btn item0">0</div>
        <div class="btn itemPoint">.</div>
        <div class="btn btn-delete itemClear" data-valor="⌫">
          <i class="bi bi-backspace"></i>
        </div>                                                          
    
    </div>
  
    <script src="./assets/js/main.js"></script>  
  </body>
</html>
